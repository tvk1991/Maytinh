<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2344/2344132.png">
    <title>ClevCalc Sentinel History+</title>
    <style>
        :root {
            --bg-color: #ffffff; --screen-bg: #ffffff; --keypad-bg: #f2f2f7;
            --key-bg: #ffffff; --key-text: #000000; --key-active: #d1d1d6;
            --expr-text: #3a3a3c; --target-area-bg: #fffaf5; --target-border: #ffecdb;
            --accent: #34c759; --op-color: #ff9500; --target-color: #ff9500;
            --danger: #ff3b30; --led-green: #34c759; --led-green-glow: 0 0 8px rgba(52, 199, 89, 0.3);
            --led-orange: #ff9500; --led-orange-glow: 0 0 10px rgba(255, 149, 0, 0.4);
            --led-red: #ff3b30; --led-red-glow: 0 0 12px rgba(255, 59, 48, 0.5);
        }
        [data-theme="dark"] {
            --bg-color: #000000; --screen-bg: #000000; --keypad-bg: #1c1c1e;
            --key-bg: #2c2c2e; --key-text: #ffffff; --key-active: #3a3a3c;
            --expr-text: #8e8e93; --target-area-bg: #1a1510; --target-border: #3d2b1f;
        }
        * {
            box-sizing: border-box; -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            touch-action: none; font-weight: 600; /* Vô hiệu hóa mọi hành động mặc định để tăng tốc touch */
        }
        html, body {
            height: 100%; margin: 0; overflow: hidden;
            background-color: var(--bg-color); position: fixed; width: 100%;
            overscroll-behavior: none; -webkit-user-select: none;
        }
        .clevcalc-container {
            width: 100vw; height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden; position: relative;
        }
        .display-screen {
            flex: 1; width: 100%;
            padding: calc(env(safe-area-inset-top) + 10px) 25px 10px 25px;
            display: flex; flex-direction: column; justify-content: flex-end; text-align: right;
            background: var(--screen-bg);
        }
        #expression {
            font-size: 1.8rem; color: var(--expr-text); min-height: 8rem;
            overflow-y: auto; word-wrap: break-word; white-space: pre-wrap;
            pointer-events: auto; /* Cho phép touch để chỉnh cursor */
        }
        .expr-cursor {
            display: inline-block; width: 2.5px; height: 1.2em;
            background: #007aff; vertical-align: middle;
            animation: blink-cur 1s step-end infinite;
        }
        @keyframes blink-cur { 50% { opacity: 0; } }
        #result-preview {
            font-size: clamp(2.5rem, 12vw, 3.2rem); color: var(--led-green);
            font-weight: 700; margin: 10px 0; text-shadow: var(--led-green-glow);
        }
        #comparison-msg { min-height: 24px; font-size: 0.9rem; font-weight: 800; margin-bottom: 10px; }
        .target-area {
            display: flex; align-items: center; background: var(--target-area-bg);
            border-radius: 16px; padding: 12px 18px; border: 1px solid var(--target-border); gap: 12px;
        }
        .keypad {
            height: 52%; display: grid; grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(5, 1fr); background: var(--keypad-bg); gap: 1px;
            padding-bottom: env(safe-area-inset-bottom);
        }
        button {
            background: var(--key-bg); border: none; font-size: 1.7rem;
            color: var(--key-text); transition: background 0.05s;
        }
        button:active { background: var(--key-active); }
        .btn-op { color: var(--op-color); font-size: 1.9rem; }
        .btn-equal { background: var(--op-color); color: white; font-size: 2.2rem; }
        .history-box {
            position: absolute; inset: 0; background: var(--screen-bg); z-index: 100;
            display: none; flex-direction: column; padding: calc(env(safe-area-inset-top) + 20px) 20px 20px;
        }
        .history-list { flex: 1; overflow-y: auto; }
        .history-item { border-bottom: 1px solid var(--keypad-bg); padding: 15px 0; }
        .led-blink-warning { animation: blink-led-warning 0.8s ease-in-out infinite; }
        @keyframes blink-led-warning { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; color: #ff3b30; } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="clevcalc-container">
    <div id="historyBox" class="history-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span style="font-size: 1.8rem; font-weight: 800; color: var(--accent);">Lịch sử</span>
            <div id="closeHistory" style="padding: 10px;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </div>
        </div>
        <div id="historyList" class="history-list"></div>
        <button id="clearHistoryBtn" style="margin-top:15px; border-radius:12px; height:60px; color:var(--danger); background: var(--keypad-bg); width:100%">Xóa tất cả</button>
    </div>

    <div class="display-screen">
        <div id="expression"></div>
        <div id="result-preview">0</div>
        <div id="comparison-msg"></div>
        <div class="target-area" id="target-area-container">
            <div id="openHistory"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--op-color)" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></div>
            <div style="width:1px; height:20px; background:var(--target-border);"></div>
            <div id="theme-toggle"><svg width="24" height="24" viewBox="0 0 24 24" fill="var(--op-color)"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"/></svg></div>
            <div id="target-box" style="flex:1; display:flex; align-items:center; cursor:pointer;">
                <span style="font-size: 0.7rem; color: var(--op-color); margin-left:10px; margin-right:5px;">MỤC TIÊU:</span>
                <div id="target-display" style="font-size: 1.4rem; color: var(--led-orange); font-weight: 800;">0</div>
            </div>
            <div id="btn-backspace"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><line x1="18" y1="9" x2="12" y2="15"></line><line x1="12" y1="9" x2="18" y2="15"></line></svg></div>
        </div>
    </div>

    <div class="keypad">
        <button class="btn-clear" data-val="C">C</button>
        <button class="btn-op" data-val="()">()</button>
        <button class="btn-op" data-val="%">%</button>
        <button class="btn-op" data-val="*">×</button>
        <button data-val="7">7</button><button data-val="8">8</button><button data-val="9">9</button>
        <button class="btn-op" data-val="-">−</button>
        <button data-val="4">4</button><button data-val="5">5</button><button data-val="6">6</button>
        <button class="btn-op" style="grid-row: span 2;" data-val="+">+</button>
        <button data-val="1">1</button><button data-val="2">2</button><button data-val="3">3</button>
        <button data-val="0">0</button><button data-val="00">00</button><button data-val=".">,</button>
        <button class="btn-equal" data-val="=">=</button>
    </div>
</div>

<script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let historyExpr = "", targetInput = "", isTargetMode = false, cursorPos = null, isResultDisplayed = false;
    let calculationHistory = JSON.parse(localStorage.getItem('calc_history') || '[]');

    const exprDiv = document.getElementById('expression'), resDiv = document.getElementById('result-preview'), 
          targetDiv = document.getElementById('target-display'), msgDiv = document.getElementById('comparison-msg');

    // TỐI ƯU CẢM ỨNG: Sử dụng touchstart để phản hồi tức thì
    const buttons = document.querySelectorAll('[data-val]');
    buttons.forEach(btn => {
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Triệt tiêu độ trễ 300ms của Safari
            const val = btn.getAttribute('data-val');
            vibrate(10); playSound('click');
            
            if (val === 'C') clearAll();
            else if (val === '=') calculate();
            else if (['+','-','*'].includes(val)) addOp(val);
            else if (val === '()') smartParenthesis();
            else if (val === '%') applyPercent();
            else handleInput(val);
        }, { passive: false });
    });

    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        if (type === 'click') {
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }
    }

    function vibrate(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

    function formatNumber(val) {
        if (!val && val !== 0) return "";
        let s = val.toString().split('.');
        s[0] = s[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return s.length > 1 ? s[0] + "," + s[1] : s[0];
    }

    function handleInput(n) {
        if (isResultDisplayed && !isTargetMode) { historyExpr = ""; isResultDisplayed = false; cursorPos = null; }
        if (isTargetMode) {
            if (n === '.' && targetInput.includes('.')) return;
            targetInput += n;
        } else {
            if (cursorPos !== null) {
                historyExpr = historyExpr.slice(0, cursorPos) + n + historyExpr.slice(cursorPos);
                cursorPos += n.length;
            } else { historyExpr += n; }
            autoPreview();
        }
        renderDisplay();
    }

    function addOp(op) {
        isResultDisplayed = false;
        if (cursorPos !== null) {
            historyExpr = historyExpr.slice(0, cursorPos) + op + historyExpr.slice(cursorPos);
            cursorPos++;
        } else {
            const last = historyExpr.slice(-1);
            if (['+','-','*','/'].includes(last)) historyExpr = historyExpr.slice(0, -1) + op;
            else if (historyExpr !== "" || op === '-') historyExpr += op;
        }
        renderDisplay();
    }

    // XỬ LÝ CURSOR CHUẨN XÁC TRÊN SAFARI
    exprDiv.addEventListener('touchstart', (e) => {
        if (historyExpr === "" || isTargetMode) return;
        const touch = e.touches[0];
        // Sử dụng Timeout cực ngắn để chờ UI render
        setTimeout(() => {
            const range = document.caretRangeFromPoint(touch.clientX, touch.clientY);
            if (range && range.startContainer) {
                let offset = range.startOffset;
                let visualPrefix = range.startContainer.textContent.substring(0, offset);
                // Loại bỏ các ký tự dấu chấm/cách ảo của định dạng số để lấy vị trí thật
                let rawOffset = visualPrefix.replace(/[^0-9\(\)\+\−\×\÷\,]/g, '').length;
                cursorPos = Math.min(rawOffset, historyExpr.length);
                renderDisplay();
            }
        }, 30);
    }, { passive: true });

    function renderDisplay() {
        if (isTargetMode) {
            document.getElementById('target-area-container').style.border = "2px solid var(--op-color)";
        } else {
            document.getElementById('target-area-container').style.border = "1px solid var(--target-border)";
            let fmt = s => s.replace(/\*/g,' × ').replace(/\//g,' ÷ ').replace(/\+/g,' + ').replace(/\-/g,' − ').replace(/(\d+(\.\d+)?)/g, m => formatNumber(m));
            if (cursorPos !== null) {
                exprDiv.innerHTML = fmt(historyExpr.slice(0, cursorPos)) + '<span class="expr-cursor"></span>' + fmt(historyExpr.slice(cursorPos));
            } else {
                exprDiv.innerText = fmt(historyExpr);
            }
        }
        targetDiv.innerText = formatNumber(targetInput) || "0";
        exprDiv.scrollTop = exprDiv.scrollHeight;
    }

    function calculate() {
        if (!historyExpr) return;
        try {
            let raw = historyExpr.replace(/×/g,'*').replace(/÷/g,'/');
            let res = eval(raw);
            let final = Math.round(res * 1000000) / 1000000;
            
            // Xử lý logic mục tiêu
            if (targetInput !== "") {
                let diff = final - parseFloat(targetInput);
                if (Math.abs(diff) < 0.0001) { msgDiv.innerText = "✅ KHỚP"; msgDiv.style.color = "var(--accent)"; }
                else { msgDiv.innerText = (diff > 0 ? "❌ VƯỢT: " : "❌ THIẾU: ") + formatNumber(Math.abs(diff).toFixed(2)); msgDiv.style.color = "var(--danger)"; }
            }

            calculationHistory.push({ expr: exprDiv.innerText, res: final, raw: historyExpr });
            localStorage.setItem('calc_history', JSON.stringify(calculationHistory));
            historyExpr = final.toString(); cursorPos = null; isResultDisplayed = true;
            resDiv.innerText = formatNumber(final);
            renderDisplay();
        } catch(e) { resDiv.innerText = "Lỗi"; }
    }

    function autoPreview() {
        try {
            let temp = historyExpr.replace(/×/g,'*').replace(/÷/g,'/');
            if (!temp) return;
            resDiv.innerText = formatNumber(eval(temp));
        } catch(e) {}
    }

    function clearAll() {
        if (isTargetMode) targetInput = "";
        else { historyExpr = ""; targetInput = ""; cursorPos = null; msgDiv.innerText = ""; }
        resDiv.innerText = "0"; renderDisplay();
    }

    function smartParenthesis() {
        let open = (historyExpr.match(/\(/g) ||[]).length, close = (historyExpr.match(/\)/g) ||[]).length;
        let char = (open > close && !['+','-','*','/','('].includes(historyExpr.slice(-1))) ? ")" : "(";
        handleInput(char);
    }

    function applyPercent() {
        try {
            let val = eval(historyExpr) / 100;
            historyExpr = val.toString(); cursorPos = null; autoPreview(); renderDisplay();
        } catch(e) {}
    }

    // Xử lý xóa (Backspace)
    const btnBack = document.getElementById('btn-backspace');
    btnBack.addEventListener('touchstart', (e) => {
        e.preventDefault(); playSound('click');
        if (isTargetMode) targetInput = targetInput.slice(0, -1);
        else {
            if (cursorPos > 0) { historyExpr = historyExpr.slice(0, cursorPos - 1) + historyExpr.slice(cursorPos); cursorPos--; }
            else historyExpr = historyExpr.slice(0, -1);
            autoPreview();
        }
        renderDisplay();
    }, { passive: false });

    // Các sự kiện UI khác
    document.getElementById('theme-toggle').onclick = () => {
        document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    };
    document.getElementById('target-box').onclick = () => { isTargetMode = !isTargetMode; renderDisplay(); };
    document.getElementById('openHistory').onclick = () => {
        document.getElementById('historyBox').style.display = 'flex';
        document.getElementById('historyList').innerHTML = calculationHistory.map((item, i) => `
            <div class="history-item" onclick="loadHist(${i})">
                <div style="font-size:0.9rem; color:var(--expr-text)">${item.expr}</div>
                <div style="font-size:1.4rem; font-weight:800; color:var(--led-green); text-align:right">${formatNumber(item.res)}</div>
            </div>
        `).reverse().join('');
    };
    document.getElementById('closeHistory').onclick = () => document.getElementById('historyBox').style.display = 'none';
    document.getElementById('clearHistoryBtn').onclick = () => { calculationHistory = []; document.getElementById('historyList').innerHTML = ""; localStorage.removeItem('calc_history'); };

    window.loadHist = (i) => {
        const item = calculationHistory[i];
        historyExpr = item.raw || item.res.toString();
        cursorPos = historyExpr.length;
        document.getElementById('historyBox').style.display = 'none';
        renderDisplay(); autoPreview();
    };

</script>
</body>
</html>
