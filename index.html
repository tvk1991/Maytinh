<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ClevCalc Pro - History & Audit</title>
    <style>
        :root {
            --bg-color: #f2f3f5;
            --accent: #2ecc71;
            --text-main: #2c3e50;
            --op-color: #f39c12;
            --target-color: #3498db;
            --danger: #e74c3c;
        }

        html, body { height: 100%; margin: 0; overflow: hidden; background-color: #000; }
        body { font-family: -apple-system, system-ui, sans-serif; display: flex; justify-content: center; align-items: center; }

        .clevcalc-container {
            width: 100vw; height: 100vh; max-width: 500px;
            background: white; display: flex; flex-direction: column;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
            position: relative;
        }

        /* Màn hình hiển thị */
        .display-screen { flex: 1; padding: 15px 20px; display: flex; flex-direction: column; justify-content: flex-end; text-align: right; position: relative; }
        
        /* Nút lịch sử */
        .history-btn { position: absolute; top: 20px; left: 20px; font-size: 1.5rem; cursor: pointer; color: #95a5a6; z-index: 10; }

        #expression { font-size: 1.8rem; color: #7f8c8d; word-wrap: break-word; word-break: break-all; line-height: 1.2; margin-bottom: 5px; max-height: 80px; overflow-y: auto; }
        #result-preview { font-size: 3rem; font-weight: 300; color: var(--text-main); margin-bottom: 10px; }

        .target-area { display: flex; align-items: center; background: #f8f9fa; border-radius: 12px; padding: 8px 15px; border: 1px dashed var(--target-color); }
        .target-label { font-size: 0.8rem; color: var(--target-color); font-weight: bold; margin-right: 10px; }
        #target-display { flex: 1; font-size: 1.5rem; color: var(--target-color); font-family: monospace; font-weight: bold; }
        
        /* Hiệu ứng rung khi lệch */
        #comparison-msg { font-size: 0.9rem; font-weight: bold; text-align: center; height: 20px; margin-top: 5px; transition: all 0.3s; }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* Hộp lịch sử */
        .history-box {
            position: absolute; top: 0; left: 0; width: 100%; height: 50%;
            background: rgba(255,255,255,0.95); z-index: 100;
            display: none; flex-direction: column; padding: 20px; box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); border-bottom: 2px solid var(--accent);
        }
        .history-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .history-item { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 0.9rem; }
        .history-item .h-expr { color: #7f8c8d; }
        .history-item .h-res { color: var(--text-main); font-weight: bold; text-align: right; }

        /* Keypad */
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(5, 1fr); background: #e0e0e0; gap: 1px; height: 60%; }
        button { width: 100%; height: 100%; border: none; background: #fff; font-size: 1.6rem; color: #333; outline: none; display: flex; justify-content: center; align-items: center; -webkit-tap-highlight-color: transparent; }
        button:active { background: #f0f0f0; transform: scale(0.96); }
        .btn-op { color: var(--op-color); font-weight: 600; background: #fafafa; }
        .btn-func { color: var(--accent); font-weight: 600; background: #fafafa; }
        .btn-clear { color: var(--danger); background: #fafafa; }
        .btn-equal { background: var(--accent); color: white; font-size: 2.2rem; }
        .btn-plus { grid-row: span 2; color: var(--op-color); font-weight: 600; }
        .active-target { background: #e3f2fd !important; border: 2px solid var(--target-color) !important; }
    </style>
</head>
<body>

<div class="clevcalc-container">
    <div id="historyBox" class="history-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <b style="color: var(--accent)">LỊCH SỬ TÍNH TOÁN</b>
            <span onclick="toggleHistory()" style="cursor:pointer; font-size: 1.2rem;">✖</span>
        </div>
        <ul id="historyList" class="history-list"></ul>
        <button onclick="clearHistory()" style="height: 40px; font-size: 0.8rem; margin-top: 10px; background: #f8f9fa;">Xóa lịch sử</button>
    </div>

    <div class="display-screen">
        <div class="history-btn" onclick="toggleHistory()">🕒</div>
        <div id="expression"></div>
        <div id="result-preview">0</div>
        <div id="comparison-msg"></div>
        <div class="target-area" id="target-box" onclick="toggleTargetMode()">
            <span class="target-label">SỐ KIỂM TRA:</span>
            <div id="target-display">0</div>
        </div>
    </div>

    <div class="keypad">
        <button class="btn-clear" onclick="clearAll()">C</button>
        <button class="btn-func" onclick="smartParenthesis()">()</button>
        <button class="btn-func" onclick="applyPercent()">%</button>
        <button class="btn-op" onclick="addOp('/')">÷</button>

        <button onclick="handleInput('7')">7</button>
        <button onclick="handleInput('8')">8</button>
        <button onclick="handleInput('9')">9</button>
        <button class="btn-op" onclick="addOp('*')">×</button>

        <button onclick="handleInput('4')">4</button>
        <button onclick="handleInput('5')">5</button>
        <button onclick="handleInput('6')">6</button>
        <button class="btn-op btn-plus" onclick="addOp('+')">+</button>

        <button onclick="handleInput('1')">1</button>
        <button onclick="handleInput('2')">2</button>
        <button onclick="handleInput('3')">3</button>

        <button onclick="backspace()">⌫</button>
        <button onclick="handleInput('0')">0</button>
        <button onclick="handleInput('.')">,</button>
        <button class="btn-equal" onclick="calculate()">=</button>
    </div>
</div>

<script>
    let historyExpr = "";
    let targetInput = "";
    let isTargetMode = false;
    let calculationHistory = []; // Mảng lưu lịch sử
    
    const exprDiv = document.getElementById('expression');
    const resDiv = document.getElementById('result-preview');
    const targetDiv = document.getElementById('target-display');
    const targetBox = document.getElementById('target-box');
    const msgDiv = document.getElementById('comparison-msg');
    const hBox = document.getElementById('historyBox');
    const hList = document.getElementById('historyList');

    function formatNumber(val) {
        if (!val && val !== 0) return "";
        let s = val.toString();
        let parts = s.split('.');
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        return parts.length > 1 ? parts[0] + "," + parts[1] : parts[0];
    }

    function toggleHistory() {
        hBox.style.display = hBox.style.display === 'flex' ? 'none' : 'flex';
        renderHistory();
    }

    function renderHistory() {
        hList.innerHTML = calculationHistory.map(item => `
            <li class="history-item">
                <div class="h-expr">${item.expr} =</div>
                <div class="h-res">${formatNumber(item.res)}</div>
            </li>
        `).reverse().join('');
    }

    function clearHistory() { calculationHistory = []; renderHistory(); }

    function toggleTargetMode() {
        isTargetMode = !isTargetMode;
        if (isTargetMode) {
            targetBox.classList.add('active-target');
            msgDiv.innerText = "Đang nhập số kiểm tra...";
            msgDiv.style.color = "var(--target-color)";
        } else {
            targetBox.classList.remove('active-target');
            msgDiv.innerText = "";
        }
    }

    function renderDisplay() {
        if (!isTargetMode) {
            let displayStr = historyExpr.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ').replace(/\+/g, ' + ').replace(/\-/g, ' − ');
            displayStr = displayStr.replace(/(\d+(\.\d+)?)/g, (match) => formatNumber(match));
            exprDiv.innerText = displayStr;
            exprDiv.scrollTop = exprDiv.scrollHeight;
        }
        targetDiv.innerText = formatNumber(targetInput) || "0";
    }

    function handleInput(n) {
        if (isTargetMode) { if (n === '.' && targetInput.includes('.')) return; targetInput += n; }
        else { historyExpr += n; autoPreview(); }
        renderDisplay();
    }

    function smartParenthesis() {
        if (isTargetMode) return;
        let openCount = (historyExpr.match(/\(/g) || []).length;
        let closeCount = (historyExpr.match(/\)/g) || []).length;
        const lastChar = historyExpr.slice(-1);
        if (openCount > closeCount && !['+','-','*','/','('].includes(lastChar)) historyExpr += ")";
        else historyExpr += "(";
        renderDisplay();
        autoPreview();
    }

    function addOp(op) {
        if (isTargetMode) { isTargetMode = false; targetBox.classList.remove('active-target'); }
        if (historyExpr === "" && op !== '-') return;
        const last = historyExpr.slice(-1);
        if (['+','-','*','/'].includes(last)) historyExpr = historyExpr.slice(0, -1) + op;
        else historyExpr += op;
        renderDisplay();
    }

    function applyPercent() {
        if (isTargetMode) return;
        try {
            let parts = historyExpr.split(/([\+\-\*\/])/);
            let lastPart = parts.pop();
            let op = parts.pop();
            let base = eval(parts.join("") || "0");
            let val = (op === '+' || op === '-') ? base * (parseFloat(lastPart) / 100) : parseFloat(lastPart) / 100;
            historyExpr = parts.join("") + (op || "") + val;
            renderDisplay(); autoPreview();
        } catch(e) {}
    }

    function autoPreview() {
        try {
            let temp = historyExpr;
            if (!temp) { resDiv.innerText = "0"; return; }
            let open = (temp.match(/\(/g) || []).length;
            let close = (temp.match(/\)/g) || []).length;
            if (open > close) temp += ")".repeat(open - close);
            resDiv.innerText = formatNumber(Math.round(eval(temp) * 1000000) / 1000000);
        } catch(e) {}
    }

    function calculate() {
        if (isTargetMode) { isTargetMode = false; targetBox.classList.remove('active-target'); return; }
        try {
            let finalRes = Math.round(eval(historyExpr) * 1000000) / 1000000;
            
            // Lưu lịch sử trước khi xóa màn hình
            calculationHistory.push({ expr: exprDiv.innerText, res: finalRes });
            
            resDiv.innerText = formatNumber(finalRes);
            if (targetInput !== "") {
                let targetVal = parseFloat(targetInput);
                msgDiv.classList.remove('shake');
                void msgDiv.offsetWidth; // Trigger reflow
                if (Math.abs(finalRes - targetVal) < 0.00001) {
                    msgDiv.innerText = "✅ KẾT QUẢ KHỚP";
                    msgDiv.style.color = "var(--accent)";
                } else {
                    msgDiv.innerText = `❌ LỆCH: ${formatNumber(Math.round((finalRes - targetVal) * 100) / 100)}`;
                    msgDiv.style.color = "var(--danger)";
                    msgDiv.classList.add('shake');
                }
            }
            historyExpr = finalRes.toString();
            exprDiv.innerText = "";
        } catch(e) { resDiv.innerText = "Lỗi"; }
    }

    function clearAll() {
        if (isTargetMode) targetInput = "";
        else { historyExpr = ""; targetInput = ""; msgDiv.innerText = ""; msgDiv.classList.remove('shake'); }
        resDiv.innerText = "0";
        renderDisplay();
    }

    function backspace() {
        if (isTargetMode) targetInput = targetInput.slice(0, -1);
        else { historyExpr = historyExpr.slice(0, -1); autoPreview(); }
        renderDisplay();
    }
</script>
</body>
</html>
